name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 运行ESLint
        run: npm run lint

  build:
    name: 构建检查
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装前端依赖
        run: npm ci

      - name: 构建前端
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  test-backend:
    name: 后端测试
    runs-on: ubuntu-latest
    needs: lint
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: gdut_dachuang_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 安装Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装后端依赖
        run: cd server && npm ci

      - name: 初始化测试数据库
        run: mysql -h 127.0.0.1 -u root -ptest_password gdut_dachuang_test < mysql-init/init.sql
        env:
          MYSQL_PWD: test_password

      - name: 运行后端测试
        run: cd server && npm test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: test_password
          DB_NAME: gdut_dachuang_test
          JWT_SECRET: test_jwt_secret
          NODE_ENV: test

  docker:
    name: Docker构建检查
    runs-on: ubuntu-latest
    needs: [build, test-backend]
    steps:
      - name: Checkout代码
        uses: actions/checkout@v4

      - name: 设置Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建Docker镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: gdut-dachuang-guide:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
